# OpenAN Knowledge Service 部署配置。
# 凭据由 .env 提供，示例见 .env.example。
name: openan-knowledge-service

services:
  postgresql:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      # 数据库初始化脚本使用以下配置创建应用角色。
      RKB_DB_USER: ${RKB_DB_USER:-rag_app}
      RKB_DB_PASSWORD: ${RKB_DB_PASSWORD:?RKB_DB_PASSWORD required}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openan}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  opensearch:
    build:
      context: ./opensearch
    image: openan/knowledge-opensearch:2.19.6-ik
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OS_ADMIN_PASSWORD:-ChangeMe_dev_0nly_2026}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'status.{1,3}(green|yellow)'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      KNOWLEDGE_BASE_HOST: 0.0.0.0
      KNOWLEDGE_BASE_PORT: 8091
      POSTGRES_HOST: postgresql
      RKB_DB_HOST: postgresql
      RKB_DB_PORT: "5432"
      RKB_DB_NAME: ${POSTGRES_DB:-openan}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-base-zh-v1.5}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-}
      MODEL_GATEWAY_EMBEDDINGS_PATH: ${MODEL_GATEWAY_EMBEDDINGS_PATH:-/embeddings}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      GENERATION_GATEWAY_URL: ${GENERATION_GATEWAY_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      GENERATION_MODELS_PATH: ${GENERATION_MODELS_PATH:-/models}
      RKB_FLOW_LLM_MODELS: ${GENERATION_MODELS:-}
      RKB_RERANK_URL: ${RERANK_URL:-}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RKB_QUERY_TRACE_ENABLED: ${RKB_QUERY_TRACE_ENABLED:-true}
      RKB_ES_HOST: opensearch
      RKB_ES_PORT: "9200"
      RKB_ES_USERNAME: ""
      RKB_ES_PASSWORD: ""
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-openan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RKB_DB_USER: ${RKB_DB_USER:-rag_app}
      RKB_DB_PASSWORD: ${RKB_DB_PASSWORD:?RKB_DB_PASSWORD required}
      AUTH_MODE: ${AUTH_MODE:-local}
      RKB_SECRET_KEY: ${RKB_SECRET_KEY:?RKB_SECRET_KEY required}
      RKB_ADMIN_USERNAME: ${RKB_ADMIN_USERNAME:-admin}
      RKB_ADMIN_PASSWORD: ${RKB_ADMIN_PASSWORD:-}
      RKB_ADMIN_PASSWORD_FILE: ${RKB_ADMIN_PASSWORD_FILE:-}
      RKB_STORAGE_BACKEND: ${RKB_STORAGE_BACKEND:-local}
      STORAGE_MAIN_PATH: /data/rkb
      RKB_KBASE_STORAGE_PATH: /data/kb
      PLUGIN_PVC_PATH: /data/rkb/plugins
      PLUGIN_SOURCE_PATH: /data/rkb/plugins/sourcefile
      ZEDX_PVC_PATH: /data/rkb/plugins/zedx
      LOG_DIR: /data/rkb/logs
    volumes:
      - kbdata:/data/kb
      - rkbdata:/data/rkb
    ports:
      - "${KNOWLEDGE_BASE_PORT:-8091}:8091"
    depends_on:
      postgresql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8091/api/knowledge-service/v1/health', timeout=3).read() == b'ok'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        BASE_URL: ${WEB_BASE_URL:-/}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  kbdata:
  osdata:
  rkbdata:
