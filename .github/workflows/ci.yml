name: Knowledge Service CI

on:
  push:
    branches: [main, 'codex/**', 'feat/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Studio frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  backend:
    name: Python tests and Compose smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: 语法检查
        run: python -m compileall -q src tests
      - name: Lint (ruff)
        run: ruff check src tests
      - name: 单元测试
        run: python -m pytest tests -q
      - name: 文档解析和沙箱测试
        run: python -m pytest src/ingestion/tests -q
      - name: Compose 启动与 API 验证
        working-directory: .
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export RKB_DB_PASSWORD="$(openssl rand -hex 24)"
          export RKB_SECRET_KEY="$(openssl rand -hex 32)"
          export RKB_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          for value in "$POSTGRES_PASSWORD" "$RKB_DB_PASSWORD" "$RKB_SECRET_KEY" "$RKB_ADMIN_PASSWORD"; do
            echo "::add-mask::$value"
          done
          trap 'docker compose -f deploy/docker-compose.yml down -v' EXIT
          sudo sysctl -w vm.max_map_count=262144
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8091/api/knowledge-service/v1/health
          python backend/tests/compose_smoke.py
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8080/ -o /dev/null
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8080/api/knowledge-service/v1/health
